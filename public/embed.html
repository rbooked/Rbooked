<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<title>Reserve a table</title>
<style>
  body { background: transparent; }
  .embed { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .powered { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .powered a { color: var(--muted); }
</style>
</head>
<body>
<div class="embed" id="booking"><p class="muted">Loading…</p></div>
<div class="powered">Reservations by <a href="/" target="_blank" rel="noopener">Tablebird</a></div>
<script src="/js/common.js"></script>
<script src="/js/booking.js"></script>
<script>
(function () {
  const slug = TB.qs('r') || TB.qs('slug');
  const color = TB.qs('color');
  if (color && /^#?[0-9a-fA-F]{3,8}$/.test(color)) document.documentElement.style.setProperty('--brand', color.startsWith('#') ? color : '#' + color);
  TB.mountBooking(document.getElementById('booking'), { slug, party: TB.qs('party'), source: 'widget', compact: true }).then(() => {
    if (color) document.getElementById('booking').style.setProperty('--brand', color.startsWith('#') ? color : '#' + color);
  });
  // Tell the parent page how tall we are so the iframe can resize (used by widget.js).
  const post = () => window.parent.postMessage({ type: 'tablebird:height', slug, height: document.documentElement.scrollHeight }, '*');
  new ResizeObserver(post).observe(document.body);
  window.addEventListener('load', post);
})();
</script>
</body>
</html>
